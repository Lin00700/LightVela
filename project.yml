name: LightVela
options:
  bundleIdPrefix: com.lin
  deploymentTarget:
    iOS: "15.0"
targets:
  LightVela:
    type: application
    platform: iOS
    sources: [LightVela]
    info:
      path: LightVela/Info.plist
      properties:
        CFBundleDisplayName: LightVela
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 网页需要使用相机
        NSMicrophoneUsageDescription: 网页需要使用麦克风
        NSPhotoLibraryUsageDescription: 网页需要选择相册中的图片
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lin.lightvela
        PRODUCT_NAME: LightVela
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
